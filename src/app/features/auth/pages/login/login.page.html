<div class="w-full min-h-screen flex flex-col md:flex-row">
  <!-- LEFT SIDE -->
  <div
    class="hidden md:flex md:w-1/2 relative overflow-hidden bg-gradient-to-br from-[#1E2A44] to-[#0F1B2E] text-white flex-col justify-between p-10"
  >
    <div class="absolute inset-0 pointer-events-none">
      <div
        class="absolute -top-24 -right-24 w-[420px] h-[420px] bg-[radial-gradient(circle,_rgba(59,130,246,0.25)_0%,_transparent_65%)]"
      ></div>
      <div
        class="absolute -bottom-32 -left-32 w-[420px] h-[420px] bg-[radial-gradient(circle,_rgba(59,130,246,0.15)_0%,_transparent_70%)]"
      ></div>
    </div>

    <a routerLink="" class="relative z-10 flex items-center gap-2">
      <div class="bg-blue-500 p-2 rounded-lg">🔍</div>
      <span class="text-lg font-semibold">LostAndFound</span>
    </a>

    <div class="relative z-10 max-w-md">
      <h1 class="text-4xl font-bold mb-4">Lost something? Found something?</h1>
      <p class="text-gray-300">The fastest way to reunite people with what matters.</p>
    </div>

    <p class="relative z-10 text-sm text-gray-400">© 2026 LostAndFound</p>
  </div>

  <!-- RIGHT SIDE -->
  <div
    class="w-full md:w-1/2 bg-gray-50 min-h-screen flex flex-col justify-center px-4 py-6 md:px-8 md:py-10 md:text-left"
  >
    <!-- Mobile logo -->
    <a routerLink="" class="md:hidden flex items-center gap-2 mb-8 justify-center">
      <div class="bg-blue-500 p-2 rounded-lg text-white">🔍</div>
      <span class="text-lg font-semibold text-gray-800"><a routerLink="">LostAndFound</a></span>
    </a>

    <div class="w-full max-w-md mx-auto">
      <div class="text-center">
        <h2 class="text-2xl md:text-3xl font-semibold text-gray-800">Welcome back</h2>
        <p class="text-gray-500 mt-2 mb-8">Log in to manage your lost and found items.</p>
      </div>

      <form [formGroup]="form" class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
        <div>
          <label class="block text-sm text-gray-700 mb-1">Email</label>
          <input
            formControlName="email"
            type="email"
            placeholder="you@example.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-sm text-gray-700">Password</label>
            <a routerLink="../reset-password" class="text-sm text-blue-600 hover:underline">
              Forgot?
            </a>
          </div>
          <input
            formControlName="password"
            type="password"
            placeholder="••••••••"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <button
          type="submit"
          class="mt-2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium shadow-md"
        >
          Log in
        </button>
      </form>

      <p class="text-sm text-gray-500 text-center mt-6">
        Don't have an account?
        <a routerLink="../register" class="text-blue-600 font-medium"> Sign up </a>
      </p>
    </div>
  </div>
</div>
