<div class="w-full min-h-screen flex flex-col md:flex-row">
  <!-- LEFT SIDE -->
  <div
    class="hidden md:flex md:w-1/2 relative overflow-hidden bg-linear-to-br from-[#1E2A44] to-[#0F1B2E] text-white flex-col justify-between p-10"
  >
    <!-- GLOW EFFECTS -->
    <div class="absolute inset-0 pointer-events-none">
      <div
        class="absolute -top-24 -right-24 w-[420px] h-[420px] bg-[radial-gradient(circle,_rgba(59,130,246,0.25)_0%,_transparent_65%)]"
      ></div>

      <div
        class="absolute -bottom-32 -left-32 w-[420px] h-[420px] bg-[radial-gradient(circle,_rgba(59,130,246,0.15)_0%,_transparent_70%)]"
      ></div>
    </div>

    <!-- CONTENT -->
    <a routerLink="" class="relative z-10 flex items-center gap-2">
      <div class="bg-blue-500 p-2 rounded-lg">🔍</div>
      <span class="text-lg font-semibold">LostAndFound</span>
    </a>

    <div class="relative z-10 max-w-md">
      <h1 class="text-5xl font-bold mb-4">Lost something? Found something?</h1>
      <p class="text-gray-300 text-xl w-11/12">
        The fastest way to reunite people with what matters. Post, search, and reclaim — all in one
        place.
      </p>
    </div>

    <p class="relative z-10 text-sm text-gray-400">© 2026 LostAndFound</p>
  </div>

  <!-- RIGHT SIDE -->
  <div
    class="w-full md:w-1/2 bg-gray-50 min-h-screen flex items-center justify-center px-6 py-10 text-center md:text-left"
  >
    <div class="w-full max-w-md">
      <a routerLink="" class="md:hidden flex items-center gap-2 mb-8 justify-center">
        <div class="bg-blue-500 p-2 rounded-lg text-white">🔍</div>
        <span class="text-lg font-semibold text-gray-800">LostAndFound</span>
      </a>

      <!-- Title -->
      <h2 class="text-2xl md:text-3xl font-semibold text-gray-800">Reset your password</h2>
      <p class="text-gray-500 mt-2 mb-8">Enter your new password below.</p>

      <!-- Form -->
      <form [formGroup]="form" class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
        <div>
          <label class="block text-sm text-gray-700 mb-1"> Enter your new password </label>
          <input
            formControlName="new_password"
            type="password"
            placeholder="At least 8 characters"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-center md:text-left"
          />
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1"> Confirm Password </label>
          <input
            formControlName="confirm_password"
            type="password"
            placeholder="At least 8 characters"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-center md:text-left"
          />
        </div>

        <!-- Button -->
        <button
          type="submit"
          class="mt-2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium transition duration-200 shadow-md"
        >
          Reset Password
        </button>
      </form>
    </div>
  </div>
</div>
